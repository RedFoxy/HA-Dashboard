              box-shadow: 0 0 5px 5px rgba(0, 0, 0, 0.4)
              border-radius: 50px
              pointer-events: none
              color: '#FFFFFF'
        image: /local/media/bambuprinter/spool.png
        card_mod:
          style: |
            ha-card {
              margin-left: auto;
              margin-right: auto;
              width: 60%;
              height: 60%;
              background: none !important;
              border: none !important;
              box-shadow: none !important;
              --tray_vt_color: {{state_attr('sensor.x1c_00m09d490200685_externalspool_bobina_esterna', 'color') }};
              --tray_vt_bg: {% if is_state_attr('sensor.x1c_00m09d490200685_externalspool_bobina_esterna', 'active', true) %} rgba(255, 255, 126, 0.5); {% else %} rgba(0,0,0,0.5); {% endif %}
            }
